<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Simple POS System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8h12l-1 12H7L6 8z"/>
          <path d="M9 8V7a3 3 0 0 1 6 0v1"/>
        </svg>
      </span>
      <h1>TinTin Store</h1>
    </div>
    <nav>
      <button class="tab-btn active" data-tab="sale">New Sale</button>
      <button class="tab-btn" data-tab="products">Products</button>
      <button class="tab-btn" data-tab="report">Sales Report</button>
    </nav>
  </header>

  <div id="message" class="message hidden" role="status" aria-live="polite"></div>

  <main>
    <!-- ===== NEW SALE ===== -->
    <section id="tab-sale" class="tab">
      <div class="sale-layout">
        <div class="panel products-panel">
          <h2>Products</h2>
          <input type="text" id="searchInput" placeholder="Search product..." autocomplete="off">
          <div id="productGrid" class="grid"></div>
        </div>

        <div class="panel cart-panel">
          <h2>Cart</h2>
          <div id="cartList"></div>
          <div class="total-row">
            <span>Total</span>
            <strong id="cartTotal">₱0.00</strong>
          </div>
          <label for="paidInput">Customer payment</label>
          <input type="number" id="paidInput" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          <p id="changeText" class="change-text"></p>
          <button id="checkoutBtn" class="btn primary full">Checkout</button>
          <button id="clearCartBtn" class="btn full">Clear Cart</button>
        </div>
      </div>
    </section>

    <!-- ===== PRODUCTS ===== -->
    <section id="tab-products" class="tab hidden">
      <div class="panel">
        <h2>Add Product</h2>
        <div class="form-row">
          <input type="text" id="newName" placeholder="Product name">
          <input type="number" id="newPrice" min="0" step="0.01" placeholder="Price">
          <input type="number" id="newStock" min="0" step="1" placeholder="Stock">
          <button id="addProductBtn" class="btn primary">Add</button>
        </div>
      </div>

      <div class="panel">
        <h2>All Products</h2>
        <div class="table-wrap">
          <table class="t-products">
            <thead>
              <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
            </thead>
            <tbody id="productsTable"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ===== REPORT ===== -->
    <section id="tab-report" class="tab hidden">
      <div class="stats">
        <div class="stat"><span>Number of sales</span><strong id="statCount">0</strong></div>
        <div class="stat"><span>Total sales</span><strong id="statTotal">₱0.00</strong></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Sales History</h2>
          <button id="clearSalesBtn" class="btn small danger">Clear History</button>
        </div>
        <div class="table-wrap">
          <table class="t-report">
            <thead>
              <tr><th>#</th><th>Date</th><th>Items</th><th>Total</th></tr>
            </thead>
            <tbody id="reportTable"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== RECEIPT POPUP ===== -->
  <div id="receiptModal" class="modal hidden">
    <div class="modal-box">
      <div id="receiptContent"></div>
      <div class="modal-buttons">
        <button id="printBtn" class="btn primary">Print</button>
        <button id="closeReceiptBtn" class="btn">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
